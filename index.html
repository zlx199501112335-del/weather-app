<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未来15天天气预报与单日详报查询</title>
    <!-- 引入 Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-glow: rgba(59, 130, 246, 0.25);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --text-light: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(255, 255, 255, 0.6);
            --temp-max: #f97316;
            --temp-min: #0284c7;
            --bg-gradient: linear-gradient(145deg, #e0f2fe 0%, #ede9fe 40%, #f0fdf4 100%);
            --yi-bg: #ecfdf5;
            --yi-color: #059669;
            --ji-bg: #fef2f2;
            --ji-color: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 顶部卡片 */
        .search-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.06), 0 4px 10px -2px rgba(0, 0, 0, 0.03);
            margin-bottom: 24px;
        }

        .search-card h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 6px;
        }

        .search-bar {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .input-wrapper {
            position: relative;
            flex: 1;
        }

        input[type="text"] {
            width: 100%;
            padding: 13px 18px;
            font-size: 15px;
            color: #1e293b;
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        button {
            padding: 13px 28px;
            font-size: 15px;
            font-weight: 600;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
            transition: all 0.25s ease;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
        }

        /* 结果卡片容器 */
        .result-box {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.06), 0 4px 10px -2px rgba(0, 0, 0, 0.03);
            min-height: 240px;
        }

        .result-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f1f5f9;
        }

        .result-title {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
        }

        .result-badge {
            font-size: 12px;
            background: #eff6ff;
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        /* 网格卡片 */
        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
            gap: 16px;
        }

        .forecast-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px 12px 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .forecast-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 28px -6px rgba(59, 130, 246, 0.15);
            border-color: #93c5fd;
        }

        .forecast-card.highlight {
            border-color: #93c5fd;
            background: linear-gradient(180deg, #f8faff 0%, #ffffff 100%);
        }

        /* 顶部日期区域样式强化 */
        .forecast-date-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            width: 100%;
        }

        .forecast-date-line {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .forecast-weekday {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 500;
        }

        .forecast-tag {
            font-size: 10px;
            font-weight: 600;
            padding: 1px 6px;
            background: #dbeafe;
            color: #1d4ed8;
            border-radius: 6px;
        }

        .weather-icon-box {
            margin: 10px 0 4px 0;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .weather-icon-box svg {
            width: 42px;
            height: 42px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06));
        }

        .forecast-weather {
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            margin-bottom: 8px;
        }

        .forecast-temp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 15px;
            font-weight: 700;
            background: #f8fafc;
            width: 100%;
            padding: 6px 0;
            border-radius: 8px;
            margin-top: 4px;
        }

        .temp-max { color: var(--temp-max); }
        .temp-divider { color: #cbd5e1; font-size: 12px; }
        .temp-min { color: var(--temp-min); }

        .forecast-wind {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 卡片内黄历（宜/忌）模块 */
        .card-lunar-box {
            width: 100%;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #e2e8f0;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }

        .card-lunar-row {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            white-space: nowrap;
        }

        .badge-yi, .badge-ji {
            font-size: 10px;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 4px;
            flex-shrink: 0;
            line-height: 1.2;
        }

        .badge-yi { background: var(--yi-bg); color: var(--yi-color); border: 1px solid #a7f3d0; }
        .badge-ji { background: var(--ji-bg); color: var(--ji-color); border: 1px solid #fecaca; }

        .card-lunar-text {
            color: #475569;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .card-tip {
            font-size: 11px;
            color: #3b82f6;
            margin-top: 8px;
            background: #f0f7ff;
            padding: 2px 8px;
            border-radius: 10px;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .forecast-card:hover .card-tip {
            opacity: 1;
            font-weight: 600;
        }

        /* 模态框样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #ffffff;
            width: 100%;
            max-width: 840px;
            max-height: 90vh;
            border-radius: 24px;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: scale(0.94) translateY(16px);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            z-index: 10;
        }

        .modal-title h3 {
            font-size: 20px;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-title p {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .modal-close {
            background: #f1f5f9;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #64748b;
            cursor: pointer;
            box-shadow: none;
            transition: 0.2s;
        }

        .modal-close:hover {
            background: #e2e8f0;
            color: #0f172a;
            transform: none;
        }

        .modal-body {
            padding: 24px;
        }

        .alarm-banner {
            background: #fef2f2;
            border-left: 4px solid #ef4444;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .alarm-title {
            color: #b91c1c;
            font-weight: 700;
            font-size: 14px;
        }
        .alarm-desc {
            font-size: 13px;
            color: #7f1d1d;
            margin-top: 4px;
            line-height: 1.4;
        }

        .detail-hero {
            background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
            border: 1px solid #dbeafe;
            border-radius: 18px;
            padding: 24px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 24px;
            margin-bottom: 20px;
        }

        .hero-temp {
            font-size: 42px;
            font-weight: 800;
            color: #1e293b;
            line-height: 1;
        }

        .hero-info-item {
            font-size: 13px;
            color: #475569;
            margin-bottom: 4px;
        }

        .hero-info-item strong {
            color: #0f172a;
        }

        .hero-tag {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        /* 模态框内的黄历卡片 */
        .modal-lunar-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .modal-lunar-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 13px;
            line-height: 1.5;
        }

        .modal-lunar-tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            flex-shrink: 0;
        }

        .modal-lunar-text {
            color: #334155;
            word-break: break-all;
        }

        .detail-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-sub);
        }

        .stat-val {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin-top: 4px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hours-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 24px;
        }

        .hours-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .hours-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 6px;
        }

        .hour-chip {
            flex: 0 0 auto;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 14px;
            text-align: center;
            min-width: 80px;
        }

        .hour-time {
            font-size: 12px;
            color: var(--text-sub);
        }

        .hour-temp {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            margin: 6px 0;
        }

        .hour-weather {
            font-size: 12px;
            color: #64748b;
        }

        .index-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 12px;
        }

        .index-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
        }

        .index-name {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .index-level {
            font-size: 12px;
            color: #2563eb;
            background: #eff6ff;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .index-desc {
            font-size: 12px;
            color: #64748b;
            margin-top: 6px;
            line-height: 1.4;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 0;
            color: var(--text-sub);
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.8;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 640px) {
            body { padding: 16px 12px; }
            .search-card, .result-box { padding: 20px 16px; }
            .search-bar { flex-direction: column; }
            button { width: 100%; }
            .forecast-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .detail-hero { grid-template-columns: 1fr; text-align: center; }
            .detail-stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="search-card">
        <h2>🌤️ 城市天气预报与老黄历</h2>
        <div class="subtitle">未来15天天气走向、气温风向与每日老黄历【宜/忌】全景查询</div>
        <div class="search-bar">
            <div class="input-wrapper">
                <input type="text" id="cityInput" value="金华" placeholder="请输入城市名称，例如：金华、丽江、北京">
            </div>
            <button id="queryBtn">
                <span>查询预报</span>
            </button>
        </div>
    </div>

    <div class="result-box" id="result">
        <div class="empty-state">
            <div class="empty-icon">📍</div>
            <p>输入城市后点击“查询预报”按钮，即可获取15天天气趋势及每日宜忌</p>
        </div>
    </div>
</div>

<!-- 单日详情模态弹窗 -->
<div class="modal-overlay" id="detailModal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">
                <h3 id="mTitle">📍 城市天气详情</h3>
                <p id="mSubtitle">预报日期：-</p>
            </div>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body" id="mBody"></div>
    </div>
</div>

<script>
    const API_APP_ID = '2072240';
    const API_APP_KEY = '2bA004eFfd6444578007E14e2E9e6655';

    let global15DaysData = [];
    let currentCity = '';
    let detailedDailyData = null;

    function getWeatherIcon(weather) {
        if (!weather) return getSunIcon();
        if (weather.includes('晴')) return getSunIcon();
        if (weather.includes('多云')) return getCloudSunIcon();
        if (weather.includes('阴')) return getCloudIcon();
        if (weather.includes('雷')) return getThunderIcon();
        if (weather.includes('雨')) return getRainIcon();
        if (weather.includes('雪')) return getSnowIcon();
        if (weather.includes('风') || weather.includes('沙')) return getWindIcon();
        return getCloudSunIcon();
    }

    function getSunIcon() {
        return `<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="14" fill="#FDB813"/><g stroke="#FDB813" stroke-width="3" stroke-linecap="round"><line x1="32" y1="6" x2="32" y2="12"/><line x1="32" y1="52" x2="32" y2="58"/><line x1="6" y1="32" x2="12" y2="32"/><line x1="52" y1="32" x2="58" y2="32"/><line x1="13.6" y1="13.6" x2="17.8" y2="17.8"/><line x1="46.2" y1="46.2" x2="50.4" y2="50.4"/><line x1="13.6" y1="50.4" x2="17.8" y2="46.2"/><line x1="46.2" y1="17.8" x2="50.4" y2="13.6"/></g></svg>`;
    }
    function getCloudSunIcon() {
        return `<svg viewBox="0 0 64 64" fill="none"><circle cx="26" cy="24" r="10" fill="#FDB813"/><path d="M46 44H20a10 10 0 1 1 2.8-19.6A13 13 0 0 1 45 27a8 8 0 0 1 1 17Z" fill="#94A3B8" opacity="0.9"/></svg>`;
    }
    function getCloudIcon() {
        return `<svg viewBox="0 0 64 64" fill="none"><path d="M48 42H20a9 9 0 1 1 2.5-17.6A12 12 0 0 1 43 26a7 7 0 0 1 5 16Z" fill="#94A3B8"/></svg>`;
    }
    function getRainIcon() {
        return `<svg viewBox="0 0 64 64" fill="none"><path d="M46 36H22a8 8 0 1 1 2.2-15.7A11 11 0 0 1 42 22a6 6 0 0 1 4 14Z" fill="#64748B"/><line x1="24" y1="42" x2="21" y2="50" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/><line x1="33" y1="42" x2="30" y2="50" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/><line x1="42" y1="42" x2="39" y2="50" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/></svg>`;
    }
    function getThunderIcon() {
        return `<svg viewBox="0 0 64 64" fill="none"><path d="M46 34H22a8 8 0 1 1 2.2-15.7A11 11 0 0 1 42 20a6 6 0 0 1 4 14Z" fill="#475569"/><polygon points="32 36 26 46 32 46 29 56 40 44 34 44" fill="#FBBF24"/></svg>`;
    }
    function getSnowIcon() {
        return `<svg viewBox="0 0 64 64" fill="none"><path d="M46 36H22a8 8 0 1 1 2.2-15.7A11 11 0 0 1 42 22a6 6 0 0 1 4 14Z" fill="#94A3B8"/><circle cx="24" cy="46" r="2" fill="#38BDF8"/><circle cx="34" cy="48" r="2" fill="#38BDF8"/><circle cx="42" cy="45" r="2" fill="#38BDF8"/></svg>`;
    }
    function getWindIcon() {
        return `<svg viewBox="0 0 64 64" fill="none"><path d="M12 28h30a6 6 0 1 0-6-6M16 36h34a6 6 0 1 1-6 6M10 44h20a5 5 0 1 0-5-5" stroke="#64748B" stroke-width="3" stroke-linecap="round"/></svg>`;
    }

    /**
     * 稳健解析日期信息
     */
    function resolveDateInfo(item, index) {
        const raw = item.day || item.date || '';
        let targetDate;

        if (raw && String(raw).length >= 8) {
            const str = String(raw).replace(/-/g, '');
            const year = parseInt(str.substring(0, 4), 10);
            const month = parseInt(str.substring(4, 6), 10) - 1;
            const day = parseInt(str.substring(6, 8), 10);
            targetDate = new Date(year, month, day);
        } else {
            targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + index);
        }

        const m = targetDate.getMonth() + 1;
        const d = targetDate.getDate();
        const y = targetDate.getFullYear();
        const shortDate = `${m}月${d}日`;
        const fullDate = `${y}年${m}月${d}日`;
        
        const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        const weekdayStr = item.weekday ? (['周一','周二','周三','周四','周五','周六','周日'][item.weekday - 1] || weekDays[targetDate.getDay()]) : weekDays[targetDate.getDay()];

        return {
            shortDate,
            fullDate,
            weekdayStr,
            rawDateStr: `${y}${String(m).padStart(2, '0')}${String(d).padStart(2, '0')}`
        };
    }

    // 回车搜索支持
    document.getElementById('cityInput').addEventListener('keyup', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('queryBtn').click();
        }
    });

    // 查询 15 天概览列表
    document.getElementById('queryBtn').addEventListener('click', function() {
        const city = document.getElementById('cityInput').value.trim();
        if (!city) {
            alert('请输入地名');
            return;
        }

        currentCity = city;
        detailedDailyData = null;

        const resultElement = document.getElementById('result');
        resultElement.innerHTML = `
            <div class="empty-state">
                <div class="spinner"></div>
                <p>正在获取【${city}】未来15天预报与黄历，请稍候...</p>
            </div>
        `;

        axios.get('https://route.showapi.com/9-9', {
            params: {
                showapi_appid: API_APP_ID,
                appKey: API_APP_KEY,
                area: city
            }
        })
        .then(function (response) {
            const data = response.data;
            if (data && data.showapi_res_code === 0) {
                const weatherInfo = data.showapi_res_body;
                let list = [];
                if (Array.isArray(weatherInfo.dayList)) {
                    list = weatherInfo.dayList;
                } else {
                    for (let i = 1; i <= 15; i++) {
                        if (weatherInfo['f' + i]) {
                            list.push(weatherInfo['f' + i]);
                        }
                    }
                }

                if (list.length === 0) {
                    resultElement.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">⚠️</div>
                            <p style="color: #d97706;">暂未获取到该地区的15天预报数据。</p>
                        </div>
                    `;
                    return;
                }

                global15DaysData = list;
                // 1. 渲染卡片基础骨架
                renderCards(list, city);
                // 2. 异步批量抓取每一天的老黄历宜忌数据
                fetchAllDaysLunar(list);
            } else {
                resultElement.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">❌</div>
                        <p style="color: #ef4444;">查询失败：${data.showapi_res_error || '未知错误'}</p>
                    </div>
                `;
            }
        })
        .catch(function (error) {
            resultElement.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">⚠️</div>
                    <p style="color: #ef4444;">请求服务异常：${error.message}</p>
                </div>
            `;
        });
    });

    // 渲染卡片：天气 + 每日黄历（宜/忌）占位
    function renderCards(list, city) {
        let cardsHtml = '';
        list.forEach((item, index) => {
            const weather = item.day_weather === item.night_weather 
                ? (item.day_weather || '晴') 
                : `${item.day_weather || ''}转${item.night_weather || ''}`;
            
            const minTemp = item.night_air_temperature;
            const maxTemp = item.day_air_temperature;
            const wind = item.day_wind_direction ? `${item.day_wind_direction} ${item.day_wind_power || ''}` : '';
            
            const dateInfo = resolveDateInfo(item, index);
            item._dateInfo = dateInfo; // 挂载给详情使用

            let badgeTag = '';
            let isSpecialDay = false;

            if (index === 0) {
                badgeTag = '<span class="forecast-tag">今天</span>';
                isSpecialDay = true;
            } else if (index === 1) {
                badgeTag = '<span class="forecast-tag">明天</span>';
                isSpecialDay = true;
            } else if (index === 2) {
                badgeTag = '<span class="forecast-tag">后天</span>';
            }

            cardsHtml += `
                <div class="forecast-card ${isSpecialDay ? 'highlight' : ''}" onclick="openDayDetail(${index})">
                    <div class="forecast-date-box">
                        <div class="forecast-date-line">
                            <span>${dateInfo.shortDate}</span>
                            ${badgeTag}
                        </div>
                        <div class="forecast-weekday">${dateInfo.weekdayStr}</div>
                    </div>
                    <div class="weather-icon-box">
                        ${getWeatherIcon(weather)}
                    </div>
                    <div class="forecast-weather">${weather}</div>
                    <div class="forecast-temp">
                        <span class="temp-min">${minTemp}°</span>
                        <span class="temp-divider">~</span>
                        <span class="temp-max">${maxTemp}°</span>
                    </div>
                    <div class="forecast-wind">
                        <span>💨</span>
                        <span>${wind || '微风'}</span>
                    </div>

                    <!-- 每日黄历（宜/忌）展示区 -->
                    <div class="card-lunar-box" id="lunar-card-${index}">
                        <div class="card-lunar-row">
                            <span class="badge-yi">宜</span>
                            <span class="card-lunar-text text-yi">加载中...</span>
                        </div>
                        <div class="card-lunar-row">
                            <span class="badge-ji">忌</span>
                            <span class="card-lunar-text text-ji">加载中...</span>
                        </div>
                    </div>

                    <div class="card-tip">查看详情 👆</div>
                </div>
            `;
        });

        document.getElementById('result').innerHTML = `
            <div class="result-header">
                <div class="result-title">📍 ${city} 15天天气与每日老黄历</div>
                <span class="result-badge">点击任意日期看详细指标</span>
            </div>
            <div class="forecast-grid">
                ${cardsHtml}
            </div>
        `;
    }

    // 并发查询每一天的黄历（宜/忌）
    function fetchAllDaysLunar(list) {
        list.forEach((item, index) => {
            const ymd = item._dateInfo.rawDateStr;
            axios.get('https://route.showapi.com/856-2', {
                params: {
                    showapi_appid: API_APP_ID,
                    appKey: API_APP_KEY,
                    ymd: ymd
                }
            })
            .then(res => {
                let yi = '诸事皆宜';
                let ji = '诸事不忌';
                if (res.data && res.data.showapi_res_code === 0 && res.data.showapi_res_body) {
                    yi = res.data.showapi_res_body.yi || '诸事皆宜';
                    ji = res.data.showapi_res_body.ji || '诸事不忌';
                }
                item._lunar = { yi, ji };
                updateCardLunar(index, yi, ji);
            })
            .catch(() => {
                const yi = '诸事皆宜';
                const ji = '诸事不忌';
                item._lunar = { yi, ji };
                updateCardLunar(index, yi, ji);
            });
        });
    }

    // 动态回填卡片内的宜忌内容
    function updateCardLunar(index, yi, ji) {
        const box = document.getElementById(`lunar-card-${index}`);
        if (box) {
            const yiEl = box.querySelector('.text-yi');
            const jiEl = box.querySelector('.text-ji');
            if (yiEl) {
                yiEl.textContent = yi;
                yiEl.title = `宜：${yi}`;
            }
            if (jiEl) {
                jiEl.textContent = ji;
                jiEl.title = `忌：${ji}`;
            }
        }
    }

    // 点击某一天打开详情
    async function openDayDetail(index) {
        const modal = document.getElementById('detailModal');
        const mBody = document.getElementById('mBody');
        const targetDayItem = global15DaysData[index];
        const dateInfo = targetDayItem._dateInfo || resolveDateInfo(targetDayItem, index);

        modal.classList.add('active');
        document.getElementById('mTitle').innerHTML = `📍 ${currentCity} 天气详报`;
        document.getElementById('mSubtitle').innerText = `预报日期：${dateInfo.fullDate} (${dateInfo.weekdayStr})`;
        mBody.innerHTML = `
            <div class="empty-state">
                <div class="spinner"></div>
                <p>正在抓取当天多维气象数据与生活指数...</p>
            </div>
        `;

        try {
            if (!detailedDailyData) {
                const res = await axios.get('https://route.showapi.com/9-2', {
                    params: {
                        showapi_appid: API_APP_ID,
                        appKey: API_APP_KEY,
                        area: currentCity,
                        needMoreDay: '1',
                        needIndex: '1',
                        needHourData: '1',
                        needAlarm: '1',
                        need3HourForcast: '1'
                    }
                });
                if (res.data && res.data.showapi_res_code === 0) {
                    detailedDailyData = res.data.showapi_res_body;
                }
            }
            renderDetailModalContent(targetDayItem, index, detailedDailyData, dateInfo);
        } catch (e) {
            console.error('详细接口获取失败，降级展示基础数据', e);
            renderDetailModalContent(targetDayItem, index, null, dateInfo);
        }
    }

    // 渲染弹窗具体内容（包含当天完整黄历）
    function renderDetailModalContent(dayItem, dayIndex, detailBody, dateInfo) {
        const mBody = document.getElementById('mBody');
        const isToday = dayIndex === 0;

        let matchedFData = null;
        if (detailBody) {
            for (let i = 1; i <= 7; i++) {
                const f = detailBody['f' + i];
                if (f && String(f.day) === String(dateInfo.rawDateStr)) {
                    matchedFData = f;
                    break;
                }
            }
            if (!matchedFData && dayIndex < 7 && detailBody['f' + (dayIndex + 1)]) {
                matchedFData = detailBody['f' + (dayIndex + 1)];
            }
        }

        const weatherDay = (matchedFData && matchedFData.day_weather) || dayItem.day_weather || '晴';
        const weatherNight = (matchedFData && matchedFData.night_weather) || dayItem.night_weather || '晴';
        const minTemp = (matchedFData && matchedFData.night_air_temperature) || dayItem.night_air_temperature;
        const maxTemp = (matchedFData && matchedFData.day_air_temperature) || dayItem.day_air_temperature;
        const sunTime = (matchedFData && matchedFData.sun_begin_end) || dayItem.sun_begin_end || '--:--|--:--';
        const [sunrise, sunset] = sunTime.split('|');

        let alarmHtml = '';
        if (detailBody && detailBody.alarmList && detailBody.alarmList.length > 0) {
            alarmHtml = detailBody.alarmList.map(a => `
                <div class="alarm-banner">
                    <div>🚨</div>
                    <div>
                        <div class="alarm-title">${a.signalType || ''}${a.signalLevel || ''}预警 [${a.issueTime || ''}]</div>
                        <div class="alarm-desc">${a.issueContent || ''}</div>
                    </div>
                </div>
            `).join('');
        }

        let nowHtml = '';
        if (isToday && detailBody && detailBody.now) {
            const now = detailBody.now;
            const aqi = detailBody.now.aqiDetail || {};
            nowHtml = `
                <div class="detail-hero">
                    <div style="display:flex; align-items:center; gap: 16px;">
                        <div style="width:58px; height:58px;">${getWeatherIcon(now.weather || weatherDay)}</div>
                        <div>
                            <div class="hero-temp">${now.temperature || maxTemp}°</div>
                            <div style="font-size:14px; color:#64748b; margin-top:4px;">实时气温 (体感 ${aqi.feels_like || now.temperature || maxTemp}°)</div>
                        </div>
                    </div>
                    <div>
                        <div class="hero-info-item"><strong>实时天气：</strong>${now.weather || weatherDay}</div>
                        <div class="hero-info-item"><strong>风向风力：</strong>${now.wind_direction || ''} ${now.wind_power || ''}</div>
                        <div class="hero-info-item"><strong>相对湿度：</strong>${now.sd || '--'}</div>
                    </div>
                    <div>
                        <span class="hero-tag">空气 ${aqi.quality || '良好'} (AQI ${now.aqi || '--'})</span>
                        <div style="font-size:12px; color:#94a3b8; margin-top:8px; text-align:right;">更新于 ${now.temperature_time || ''}</div>
                    </div>
                </div>
            `;
        } else {
            nowHtml = `
                <div class="detail-hero">
                    <div style="display:flex; align-items:center; gap: 16px;">
                        <div style="width:58px; height:58px;">${getWeatherIcon(weatherDay)}</div>
                        <div>
                            <div class="hero-temp">${minTemp}° ~ ${maxTemp}°</div>
                            <div style="font-size:14px; color:#64748b; margin-top:4px;">全天气温走向</div>
                        </div>
                    </div>
                    <div>
                        <div class="hero-info-item"><strong>白天天气：</strong>${weatherDay} (${dayItem.day_wind_direction || ''} ${dayItem.day_wind_power || ''})</div>
                        <div class="hero-info-item"><strong>夜晚天气：</strong>${weatherNight} (${dayItem.night_wind_direction || ''} ${dayItem.night_wind_power || ''})</div>
                    </div>
                    <div>
                        <span class="hero-tag">${dayIndex === 1 ? '明天预报' : dateInfo.weekdayStr}</span>
                    </div>
                </div>
            `;
        }

        // 弹窗内的完整老黄历（宜/忌）展示
        const lunarData = dayItem._lunar || { yi: '诸事皆宜', ji: '诸事不忌' };
        const lunarHtml = `
            <div class="modal-lunar-card">
                <div class="modal-lunar-row">
                    <span class="modal-lunar-tag badge-yi">宜</span>
                    <span class="modal-lunar-text">${lunarData.yi}</span>
                </div>
                <div class="modal-lunar-row">
                    <span class="modal-lunar-tag badge-ji">忌</span>
                    <span class="modal-lunar-text">${lunarData.ji}</span>
                </div>
            </div>
        `;

        const statsHtml = `
            <div class="detail-stats">
                <div class="stat-item">
                    <div class="stat-label">🌅 日出时间</div>
                    <div class="stat-val">${sunrise || '--:--'}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">🌇 日落时间</div>
                    <div class="stat-val">${sunset || '--:--'}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">💧 降水概率</div>
                    <div class="stat-val">${(matchedFData && matchedFData.jiangshui) || dayItem.jiangshui || '--'}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">☀️ 紫外线</div>
                    <div class="stat-val">${(matchedFData && matchedFData.ziwaixian) || (matchedFData && matchedFData.index && matchedFData.index.uv && matchedFData.index.uv.title) || '--'}</div>
                </div>
            </div>
        `;

        let hoursHtml = '';
        if (isToday && detailBody && Array.isArray(detailBody.hourDataList) && detailBody.hourDataList.length > 0) {
            const chips = detailBody.hourDataList.map(h => `
                <div class="hour-chip">
                    <div class="hour-time">${h.time ? h.time.slice(8, 10) + ':00' : ''}</div>
                    <div class="hour-temp">${h.temperature}°</div>
                    <div class="hour-weather">${h.weather || ''}</div>
                </div>
            `).join('');

            hoursHtml = `
                <div class="section-title">⏱️ 当日气温走势监测</div>
                <div class="hours-scroll">
                    ${chips}
                </div>
            `;
        }

        let indexHtml = '';
        const idx = (matchedFData && matchedFData.index) || (detailBody && detailBody.f1 && detailBody.f1.index);
        if (idx) {
            const indexConfigs = [
                { key: 'clothes', name: '👔 穿衣指数' },
                { key: 'comfort', name: '🌿 舒适指数' },
                { key: 'cold', name: '💊 感冒指数' },
                { key: 'uv', name: '🧴 紫外线指数' },
                { key: 'wash_car', name: '🚗 洗车指数' },
                { key: 'sports', name: '🏃 运动指数' },
                { key: 'travel', name: '✈️ 旅游指数' },
                { key: 'beauty', name: '💄 化妆指数' }
            ];

            const cards = indexConfigs.map(cfg => {
                const item = idx[cfg.key];
                if (!item) return '';
                return `
                    <div class="index-card">
                        <div class="index-name">
                            <span>${cfg.name}</span>
                            <span class="index-level">${item.title || item.level || '适宜'}</span>
                        </div>
                        <div class="index-desc">${item.desc || '保持良好心态，享受今日天气。'}</div>
                    </div>
                `;
            }).filter(Boolean).join('');

            if (cards) {
                indexHtml = `
                    <div class="section-title">🧭 当日生活气象指南</div>
                    <div class="index-grid">
                        ${cards}
                    </div>
                `;
            }
        } else if (dayIndex >= 7) {
            indexHtml = `
                <div style="background:#f8fafc; border-radius:12px; padding:16px; font-size:13px; color:#64748b; text-align:center;">
                    ℹ️ 远期预报（7天以后）气象台暂不输出精细生活指数与小时数据，以上温度及风向为未来大趋势演算结果。
                </div>
            `;
        }

        mBody.innerHTML = `
            ${alarmHtml}
            ${nowHtml}
            ${lunarHtml}
            ${statsHtml}
            ${hoursHtml}
            ${indexHtml}
        `;
    }

    function closeModal() {
        document.getElementById('detailModal').classList.remove('active');
    }

    document.getElementById('detailModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    window.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
    });

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('queryBtn').click();
    });
</script>

</body>
</html>
